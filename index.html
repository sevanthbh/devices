<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Sci‑Fi Deactivate Panel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    html, body {margin:0; padding:0; width:100%; height:100%; background:#05060a; display:flex; align-items:center; justify-content:center; font-family:'Orbitron', sans-serif; color:#fff; overflow:hidden;}

    .terminal {width:90vw; max-width:400px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:18px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,0.7), 0 0 40px rgba(62,240,255,0.025) inset; border:1px solid rgba(62,240,255,0.06); position:relative; text-align:center;}

    h1 {font-size:18px; letter-spacing:1px; color:#3ef0ff; font-weight:900; margin-bottom:15px; text-shadow:0 0 10px rgba(62,240,255,0.45);}
    .subtitle {font-size:12px; margin-bottom:18px; color:#9fdcf7; opacity:0.9;}

    .panel {display:flex; flex-direction:column; gap:15px; align-items:center; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.03)); border-radius:12px; padding:18px; border:1px solid rgba(124,255,110,0.04); transition: opacity .3s ease;}

    .digits {display:flex; gap:8px; justify-content:center; margin-bottom:12px;}
    .digit {width:40px; height:50px; border-radius:8px; background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(255,255,255,0.02)); border:1px solid rgba(62,240,255,0.08); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; letter-spacing:4px; color:#3ef0ff; text-shadow:0 0 12px rgba(62,240,255,0.25); transition: transform .12s ease;}
    .digit.active {transform:translateY(-4px) scale(1.03);}

    .btn {padding:10px 18px; border-radius:10px; border:1px solid rgba(62,240,255,0.12); background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); color:#3ef0ff; font-weight:700; cursor:pointer; font-size:14px; transition:transform .12s ease;}
    .btn:hover {transform:translateY(-2px);}

    #hiddenInput {position:absolute; left:-9999px;}

    .status {margin-top:15px; font-size:12px; font-weight:700; color:#9fdcf7; min-height:20px; transition: opacity .3s ease;}

    .lock{width:60px;height:60px;border-radius:12px;background:linear-gradient(180deg,#07162a,#021021); display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.03); box-shadow:0 6px 30px rgba(0,0,0,0.6); position:relative; overflow:hidden; margin-bottom:10px;}
    .shackle{position:absolute;top:6px;width:32px;height:20px;border-radius:12px;border:4px solid rgba(255,255,255,0.06);left:50%;transform:translateX(-50%);}
    .lock-core{width:32px;height:40px;background:linear-gradient(180deg,#071a2a,#04121a);border-radius:6px;border:1px solid rgba(62,240,255,0.06);display:flex;align-items:center;justify-content:center}

    /* Blinking green neon */
    @keyframes blink {0%, 50%, 100% {opacity:1;} 25%, 75% {opacity:0;}}
    .blinking-green {position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:64px; font-weight:900; color:#0f0; text-shadow:0 0 10px #0f0,0 0 20px #0f0,0 0 40px #0f0; animation:blink 1s infinite; z-index:100; text-align:center;}
    /* Red neon */
    .red-neon {position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:64px; font-weight:900; color:#ff1a1a; text-shadow:0 0 10px #ff1a1a,0 0 20px #ff4d4d,0 0 40px #ff1a1a; z-index:100; text-align:center;}

    @keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
    .shake{animation:shake .48s ease}
  </style>
</head>
<body>

<div class="terminal" id="terminal">
  <h1 id="mainTitle">ENTER A CODE TO DEACTIVATE</h1>
  <div class="subtitle" id="subtitle">System Control — Access required to shut down perimeter grid</div>

  <div class="panel" id="panel">
    <div class="digits" id="digits">
      <div class="digit">–</div>
      <div class="digit">–</div>
      <div class="digit">–</div>
      <div class="digit">–</div>
      <div class="digit">–</div>
      <div class="digit">–</div>
    </div>

    <div class="lock" id="lock">
      <div class="shackle"></div>
      <div class="lock-core">🔒</div>
    </div>

    <input id="hiddenInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">
    <button class="btn" id="enterBtn">ENTER</button>
  </div>

  <div class="status" id="status">Type the 6‑digit numeric code and press ENTER</div>
</div>

<script>
const targetCode = '560064';
const hidden = document.getElementById('hiddenInput');
const digits = Array.from(document.querySelectorAll('.digit'));
const status = document.getElementById('status');
const enter = document.getElementById('enterBtn');
const mainTitle = document.getElementById('mainTitle');
const subtitle = document.getElementById('subtitle');
const panel = document.getElementById('panel');
const lock = document.getElementById('lock');

function focusInput(){ hidden.focus(); }
focusInput();
document.getElementById('terminal').addEventListener('click', focusInput);

hidden.addEventListener('input', ()=>{
  const v = hidden.value.replace(/\D/g,'').slice(0,6);
  for(let i=0;i<6;i++){
    digits[i].textContent=v[i]||'–';
    digits[i].classList.toggle('active',!!v[i]);
  }
  status.textContent = v.length===6 ? 'Press ENTER to submit code' : 'Type the 6‑digit numeric code and press ENTER';
  lock.classList.remove('active');
});

hidden.addEventListener('keydown', e=>{if(e.key==='Enter') submitCode();});
enter.addEventListener('click', submitCode);

function submitCode(){
  const v = hidden.value.replace(/\D/g,'');
  if(v.length!==6){status.textContent='Code must be 6 digits.'; focusInput(); return;}

  if(v===targetCode){
    // Hide all panel elements
    mainTitle.style.display='none';
    subtitle.style.display='none';
    panel.style.display='none';
    status.style.display='none';

    lock.classList.add('active');
    document.querySelector('.lock-core').textContent='🔓';
    hidden.disabled=true;
    enter.disabled=true;

    // Stage 1: Blinking green SYSTEM DEACTIVATED
    const systemMsg = document.createElement('div');
    systemMsg.className='blinking-green';
    systemMsg.textContent='SYSTEM DEACTIVATED';
    document.body.appendChild(systemMsg);

    // Stage 2: After 2s, replace with red ANTONY IS BACK!..
    setTimeout(()=>{
      systemMsg.remove();
      const antonyMsg = document.createElement('div');
      antonyMsg.className='red-neon';
      antonyMsg.textContent='ANTONY IS BACK!..';
      document.body.appendChild(antonyMsg);
    },2000);

  } else {
    digits.forEach(d=>d.classList.add('shake'));
    setTimeout(()=>{
      digits.forEach(d=>d.classList.remove('shake'));
      hidden.value='';
      digits.forEach(d=>d.textContent='–');
      focusInput();
      status.textContent='Type the 6‑digit numeric code and press ENTER';
    },500);
  }
}
</script>

</body>
</html>
